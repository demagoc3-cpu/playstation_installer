# PackageFlow in Docker (Linux).
#   docker compose up -d        → http://<IP компьютера>:3000
# Replace /path/to/games with the folder that holds your PKG files
# and enter /games as the folder in the app.

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    network_mode: host

    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Amsterdam

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    network_mode: host

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam

    volumes:
      - ./prowlarr:/config


  packageflow:
    image: demagoc3/packageflow:latest
    container_name: packageflow
    restart: unless-stopped

    # Required: the console downloads packages from this computer and the
    # PyLoader payload connects back to it, so the container must use the
    # host network and see the computer's real LAN IP.
    network_mode: host
#    ports:
#      - "3001:3000"

    volumes:
      - packageflow-data:/app/.data   # settings, queue, pairing tokens
      - /mnt/nas-downloads:/games:ro      # your PKG files

volumes:
  packageflow-data:
