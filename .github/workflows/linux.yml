name: Linux packages
# Builds the .deb and AppImage from this repository like the Windows installer:
# WEB from source, the Linux desktop shell from apps/linux-desktop and the
# console bundle of the calling release run (release.yml), or for
# workflow_dispatch the pinned bundle from the GitHub releases.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (three numbers, for example 1.10.28)'
        required: true
        default: '1.10.28'
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      console-artifact:
        description: 'Console bundle artifact of the calling release run'
        type: string
        required: false
        default: ''
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gdkpixbuf-2.0 librsvg2-common squashfs-tools dpkg-dev
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "value=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Desktop shell tests
        run: python3 -m unittest discover -s apps/linux-desktop/tests
      - uses: actions/download-artifact@v4
        if: inputs.console-artifact != ''
        with:
          name: ${{ inputs.console-artifact }}
          path: dist/console-bundle
      - name: Console bundle
        if: inputs.console-artifact == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-console-bundle.mjs "${{ steps.version.outputs.value }}" dist/console-bundle
      - name: Build .deb and AppImage
        run: python3 packaging/linux/build.py --version "${{ steps.version.outputs.value }}" --bundle dist/console-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: PackageFlow-Linux-x64
          if-no-files-found: error
          path: |
            dist/linux/packageflow_*_amd64.deb
            dist/linux/PackageFlow-*-x86_64.AppImage
            dist/linux/SHA256SUMS
      - name: Attach to the release
        if: inputs.console-artifact != '' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp dist/linux/SHA256SUMS dist/linux/SHA256SUMS-linux.txt
          gh release upload "$TAG" --clobber dist/linux/packageflow_*_amd64.deb dist/linux/PackageFlow-*-x86_64.AppImage dist/linux/SHA256SUMS-linux.txt
