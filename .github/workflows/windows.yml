name: Windows installer
# Independent from docker.yml: packages the WEB build and Windows runtime.
# release.yml calls it for a v* tag with the release's console bundle;
# workflow_dispatch builds only this Windows artifact from the console pin.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (three numbers, for example 1.11.0)'
        required: true
        default: '1.10.29'
      attach:
        description: 'Attach the build to the existing release vX.Y.Z'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      console-artifact:
        description: 'Console bundle artifact of the calling release run'
        type: string
        required: false
        default: ''
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        if: inputs.console-artifact != ''
        with:
          name: ${{ inputs.console-artifact }}
          path: dist/console-bundle
      - name: Install NSIS compiler
        run: choco install nsis --yes --no-progress
      - name: Build installer
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CONSOLE_ARTIFACT: ${{ inputs.console-artifact }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $version = $env:INPUT_VERSION
          if (-not $env:CONSOLE_ARTIFACT) {
            # The PS5/PS4 binaries come from the GitHub releases, verified against
            # the console bundle pin (see scripts/fetch-console-bundle.mjs).
            node scripts/fetch-console-bundle.mjs $version dist/console-bundle
            if ($LASTEXITCODE) { throw 'Console bundle download failed' }
          }
          # A version without its own pin is checked against the bundle it ships.
          if (-not (Test-Path "packaging/windows/console-bundle-$version.json")) {
            $env:PF_CONSOLE_PIN = (Resolve-Path dist/console-bundle/manifest.json).Path
          }
          ./packaging/windows/build.ps1 -Version $version -Ps5Bundle (Resolve-Path dist/console-bundle).Path
          Get-FileHash dist/windows/PackageFlowSetup-*-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/windows/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PackageFlow-Windows-x64
          if-no-files-found: error
          path: |
            dist/windows/PackageFlowSetup-*-x64.exe
            dist/windows/SHA256SUMS-windows.txt
      - name: Attach to the release
        if: (inputs.console-artifact != '' && github.ref_type == 'tag') || inputs.attach
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: gh release upload "$TAG" --clobber dist/windows/PackageFlowSetup-*-x64.exe dist/windows/SHA256SUMS-windows.txt
