name: Windows installer
# Independent from docker.yml: packages the WEB build and Windows runtime.
# No Docker image is built or pushed by this workflow. A v* tag triggers both
# workflows separately; workflow_dispatch builds only this Windows artifact.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (three numbers, for example 1.11.0)'
        required: true
        default: '1.10.28'
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install NSIS compiler
        run: choco install nsis --yes --no-progress
      - name: Build installer
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $env:INPUT_VERSION }
          # The PS5/PS4 binaries come from the GitHub releases, verified against
          # the console bundle pin (see scripts/fetch-console-bundle.mjs).
          node scripts/fetch-console-bundle.mjs $version dist/console-bundle
          if ($LASTEXITCODE) { throw 'Console bundle download failed' }
          ./packaging/windows/build.ps1 -Version $version -Ps5Bundle (Resolve-Path dist/console-bundle).Path
          Get-FileHash dist/windows/PackageFlowSetup-*-x64.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/windows/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PackageFlow-Windows-x64
          if-no-files-found: error
          path: |
            dist/windows/PackageFlowSetup-*-x64.exe
            dist/windows/SHA256SUMS-windows.txt
      - name: Attach to the release vX.Y.Z
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # One release per version carries every file; the first workflow to
          # get here creates it, the other attaches to it.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "PackageFlow ${TAG#v}" --generate-notes ||
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" --clobber dist/windows/PackageFlowSetup-*-x64.exe dist/windows/SHA256SUMS-windows.txt
